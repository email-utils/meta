name: Release

# release-please, then a staged npm publish, for a package repo. Called from
# each package's release.yml on every push to main.
#
# release-please keeps a release PR open with the next version and changelog.
# Merging it tags the release and creates the GitHub release, and then:
#   - build packs the tarball, without any publish credentials
#   - publish stages that tarball on npm through OIDC trusted publishing, with
#     provenance. Nothing goes live until a maintainer approves the stage
#     with 2FA; the job summary has the stage ID and the commands.
#
# npm checks the caller's filename, so each package's trusted publisher names
# release.yml in the package repo, not this file. Both need `id-token: write`.
# `$/` resolves to meta at this workflow's own commit.
on:
  workflow_call:
    inputs:
      app-client-id:
        description: Client ID of the org's release GitHub App
        type: string
        required: true
    secrets:
      app-private-key:
        description: Private key of the org's release GitHub App
        required: true

permissions: {}

defaults:
  run:
    shell: bash

jobs:
  release-please:
    name: release-please
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions: {}
    outputs:
      created: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      # Not github.token: a PR it opens or updates gets its PR gate only after
      # someone approves the run, once per push to main.
      - name: Create a release token
        id: token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ inputs.app-client-id }}
          private-key: ${{ secrets.app-private-key }}
          permission-contents: write # release branch, tags, and GitHub releases
          permission-pull-requests: write # the release PR
          permission-issues: write # the release PR's labels

      # Reads release-please-config.json and .release-please-manifest.json
      # from the package.
      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.token.outputs.token }}

  build:
    name: build
    needs: release-please
    if: needs.release-please.outputs.created == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read # check out the release tag
    outputs:
      name: ${{ steps.pack.outputs.name }}
    env:
      # lefthook's install script would set up git hooks that never run here.
      LEFTHOOK: 0
    steps:
      - name: Check out the release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag }}
          persist-credentials: false

      # No npm cache: a release is built from a clean install.
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Check repository.url
        uses: $/.github/actions/repository-url

      - name: Install dependencies
        run: npm ci

      # Built here rather than by prepack, so `npm pack` prints only its own
      # output.
      - name: Build and check the package
        run: |
          npm run build
          npm run check:package

      - name: Pack the tarball
        id: pack
        env:
          VERSION: ${{ needs.release-please.outputs.version }}
        run: |
          read -r name version < <(node -p 'const p = require("./package.json"); p.name + " " + p.version')
          if [ "$version" != "$VERSION" ]; then
            echo "::error file=package.json::version is $version, but release-please released $VERSION."
            exit 1
          fi
          mkdir "$RUNNER_TEMP/package"
          npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP/package"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - name: Upload the tarball
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package
          path: ${{ runner.temp }}/package/*.tgz
          if-no-files-found: error
          retention-days: 7

  # The only job with an OIDC token. It installs nothing from the package, so
  # no dependency's code runs where it could publish.
  publish:
    name: publish
    needs: [release-please, build]
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      id-token: write # npm trusted publishing and provenance
    steps:
      - name: Download the tarball
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package
          path: ${{ runner.temp }}/package

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false

      # `npm stage` needs npm 11.15 or later. Pinned, rather than whichever
      # npm the runner's Node 24 bundles.
      - name: Install npm
        # An exact version: there's no lockfile to hold it.
        run: npm install --global npm@12.1.0 # zizmor: ignore[adhoc-packages]

      # Prereleases (1.0.0-rc.1) go to `next`, so `latest` stays on the last
      # final version.
      - name: Stage the release on npm
        id: stage
        env:
          NAME: ${{ needs.build.outputs.name }}
          VERSION: ${{ needs.release-please.outputs.version }}
        run: |
          tag=latest
          if [[ "$VERSION" == *-* ]]; then tag=next; fi
          tarball=$(echo "$RUNNER_TEMP"/package/*.tgz)
          npm stage publish "$tarball" --tag "$tag" --access public --json | tee "$RUNNER_TEMP/stage.json"
          stage_id=$(jq -r --arg name "$NAME" '.[$name].stageId // empty' "$RUNNER_TEMP/stage.json")
          if [ -z "$stage_id" ]; then
            echo "::error::npm staged $NAME@$VERSION but returned no stage ID. Find it with \`npm stage list $NAME\`."
            exit 1
          fi
          {
            echo "tag=$tag"
            echo "stage-id=$stage_id"
          } >> "$GITHUB_OUTPUT"

      - name: Write job summary
        env:
          NAME: ${{ needs.build.outputs.name }}
          VERSION: ${{ needs.release-please.outputs.version }}
          TAG: ${{ steps.stage.outputs.tag }}
          STAGE_ID: ${{ steps.stage.outputs.stage-id }}
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          > [!IMPORTANT]
          > 📦 **$NAME@$VERSION is staged on npm for \`$TAG\`** and isn't live until a maintainer approves it with 2FA.

          Stage ID: \`$STAGE_ID\`

          \`\`\`sh
          npm stage view $STAGE_ID     # version, files, and provenance
          npm stage approve $STAGE_ID  # prompts for 2FA
          \`\`\`

          Or approve it from the package's **Staged Packages** tab on npmjs.com, once npm's malware scan finishes.
          EOF
