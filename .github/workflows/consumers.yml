name: Consumers

# Installs a package's packed tarball into fresh consumer projects and loads
# every entry point in its `exports` the way users would, reported as
# `consumers / <name>`. Called from each package's pr-gate.yml.
#
#   - pack builds the package and packs the tarball, as release.yml does,
#     and lists the jobs below that apply to it
#   - node22, node24, node26 `require` and `import` it on each supported Node
#   - typescript5, typescript6, typescript7 check it with `node16`,
#     `nodenext`, and `bundler` resolution on each TypeScript major
#   - browser builds it with Vite, failing on any import of a Node built-in.
#     A package that needs Node by design, like validator-dns, has no
#     browser job, so its ruleset mustn't require one.
#
# The fixtures are .github/consumers in meta, at this workflow's own commit.
# check.mjs there lists the jobs and runs each leg, and runs locally too.
# `$/` resolves to the same commit.
on:
  workflow_call:

permissions: {}

defaults:
  run:
    shell: bash

jobs:
  pack:
    name: pack
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read # check out the package and meta's fixtures
    outputs:
      jobs: ${{ steps.jobs.outputs.jobs }}
    env:
      # lefthook's install script would set up git hooks that never run here.
      LEFTHOOK: 0
    steps:
      - name: Check out the package
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # This workflow's own commit, so the fixtures match the pinned workflow
      # rather than whatever meta's main holds now. The package's `files`
      # keeps it out of the tarball.
      - name: Check out meta's fixtures
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .meta
          sparse-checkout: .github/consumers
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build the package
        run: npm run build

      - name: Pack the tarball
        run: |
          mkdir "$RUNNER_TEMP/package"
          npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP/package"

      - name: List the jobs
        id: jobs
        run: |
          tarball=$(echo "$RUNNER_TEMP"/package/*.tgz)
          echo "jobs=$(node .meta/.github/consumers/check.mjs jobs "$tarball")" >> "$GITHUB_OUTPUT"

      # Named for this workflow: the caller's other jobs share the run's
      # artifact names.
      - name: Upload the tarball
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: consumers-package
          path: ${{ runner.temp }}/package/*.tgz
          if-no-files-found: error
          retention-days: 1

  consumer:
    # Without it, each leg reports as `consumers / consumer (<name>)`.
    name: ${{ matrix.name }}
    needs: pack
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read # check out meta's fixtures
    strategy:
      # A cancelled leg reports cancelled, which a required check reads as
      # unsatisfied, so one failure mustn't cancel the others.
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.pack.outputs.jobs) }}
    steps:
      - name: Check out meta's fixtures
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .meta
          sparse-checkout: .github/consumers
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: .meta/.github/consumers/package-lock.json

      - name: Download the tarball
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: consumers-package
          path: ${{ runner.temp }}/package

      - name: Run ${{ matrix.name }}
        id: run
        env:
          LEG: ${{ matrix.leg }}
        run: |
          tarball=$(echo "$RUNNER_TEMP"/package/*.tgz)
          node .meta/.github/consumers/check.mjs "$LEG" "$tarball" 2>&1 | tee "$RUNNER_TEMP/output.log"

      - name: Write job summary
        if: always()
        uses: $/.github/actions/job-summary
        with:
          check-name: ${{ matrix.label }}
          outcome: ${{ steps.run.outcome }}
          log-file: ${{ runner.temp }}/output.log
