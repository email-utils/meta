version: 2
updates:
  # Meta's workflows and composite actions, and the package workflows in
  # templates/synced, which reach the packages through a sync.
  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/*
      - /templates/synced
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
      include: scope
    groups:
      actions:
        patterns:
          - '*'
    ignore:
      # The package callers pin meta by hand, to a commit on main.
      - dependency-name: email-utils/meta

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore
      include: scope

  # The tools in consumers.yml's fixtures, which the packages' PR gates run.
  - package-ecosystem: npm
    directory: /.github/consumers
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
      include: scope
    ignore:
      # Node 22's types, the oldest Node the packages support.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
      # Aliases for the TypeScript majors before 7, which stay on theirs.
      - dependency-name: typescript5
        update-types: ['version-update:semver-major']
      - dependency-name: typescript6
        update-types: ['version-update:semver-major']

  # The docs site, its own npm project. Fumadocs' packages release in step and
  # pin each other, so they update together. The site's code samples are
  # checked against the `@email-utils/*` packages, so those come daily and
  # skip the cooldown, as in the packages; everything else waits it out.
  - package-ecosystem: npm
    directory: /docs
    schedule:
      interval: daily
    cooldown:
      default-days: 7
      exclude:
        - '@email-utils/*'
    commit-message:
      prefix: chore
      include: scope
    groups:
      email-utils:
        patterns:
          - '@email-utils/*'
      fumadocs:
        patterns:
          - 'fumadocs-*'

  # The API reference's generator, its own npm project inside the site's.
  # TypeDoc supports TypeScript up to 6, so TypeScript stays on 6 until a
  # TypeDoc release supports 7.
  - package-ecosystem: npm
    directory: /docs/typedoc
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore
      include: scope
    groups:
      typedoc:
        patterns:
          - '*'
    ignore:
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
