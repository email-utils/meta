version: 2
updates:
  # Meta's workflows and composite actions, and the package workflows in
  # templates/synced, which reach the packages through a sync.
  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/*
      - /templates/synced
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
      include: scope
    groups:
      actions:
        patterns:
          - '*'
    ignore:
      # The package callers pin meta by hand, to a commit on main.
      - dependency-name: email-utils/meta

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore
      include: scope

  # The tools in consumers.yml's fixtures, which the packages' PR gates run.
  - package-ecosystem: npm
    directory: /.github/consumers
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
      include: scope
    ignore:
      # Node 22's types, the oldest Node the packages support.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
      # Aliases for the TypeScript majors before 7, which stay on theirs.
      - dependency-name: typescript5
        update-types: ['version-update:semver-major']
      - dependency-name: typescript6
        update-types: ['version-update:semver-major']

  # The docs site, its own npm project. Fumadocs' packages release in step and
  # pin each other, so they update together.
  - package-ecosystem: npm
    directory: /docs
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore
      include: scope
    groups:
      fumadocs:
        patterns:
          - 'fumadocs-*'
